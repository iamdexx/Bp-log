name: BPLog
options:
  bundleIdPrefix: com.eticahub
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
packages:
  BPCore:
    path: BPCore
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: "11.13.0"
targets:
  BPLog:
    type: application
    platform: iOS
    sources:
      - path: BPLog/Sources
      - path: BPLog/Resources
    dependencies:
      - package: BPCore
      - package: GoogleMobileAds
    info:
      path: BPLog/Info.plist
      properties:
        CFBundleDisplayName: BP Log
        CFBundleName: BP Log
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSHealthShareUsageDescription: BP Log reads blood pressure, heart rate, blood oxygen and weight from Apple Health so your history is complete.
        NSHealthUpdateUsageDescription: BP Log saves the readings you enter to Apple Health so your other health apps can see them.
        NSCameraUsageDescription: Point the camera at your cuff screen to read the numbers automatically. Photos never leave your phone.
        NSUserTrackingUsageDescription: This lets us show ads that are more relevant to you on the free plan. You can say no and ads still work.
        GADApplicationIdentifier: ca-app-pub-3940256099942544~1458002511
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
        UIBackgroundModes: []
    entitlements:
      path: BPLog/BPLog.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-identifiers: [iCloud.com.eticahub.bplog]
        com.apple.developer.in-app-payments: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eticahub.bplog
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
    scheme:
      testTargets: [BPLogTests]
      storeKitConfiguration: BPLog/Resources/Products.storekit
  BPLogTests:
    type: bundle.unit-test
    platform: iOS
    sources: [BPLog/Tests]
    dependencies:
      - target: BPLog

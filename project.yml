name: BPLog
options:
  bundleIdPrefix: com.eticahub
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "15.4"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
packages:
  BPCore:
    path: BPCore
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: "12.0.0"
targets:
  BPLog:
    type: application
    platform: iOS
    sources:
      - path: BPLog/Sources
      - path: BPLog/Resources
    dependencies:
      - package: BPCore
      - package: GoogleMobileAds
      - target: BPLogWidget
      - target: BPLogWatch
    info:
      path: BPLog/Info.plist
      properties:
        CFBundleDisplayName: BP Log
        CFBundleName: BP Log
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSHealthShareUsageDescription: BP Log reads blood pressure, heart rate, blood oxygen and weight from Apple Health so your history is complete.
        NSHealthUpdateUsageDescription: BP Log saves the readings you enter to Apple Health so your other health apps can see them.
        NSBluetoothAlwaysUsageDescription: BP Log connects to your blood pressure cuff over Bluetooth to pull in readings automatically.
        NSFaceIDUsageDescription: Unlock BP Log with Face ID so only you can see your readings.
        NSCameraUsageDescription: Point the camera at your cuff screen to read the numbers automatically. Photos never leave your phone.
        NSUserTrackingUsageDescription: This lets us show ads that are more relevant to you on the free plan. You can say no and ads still work.
        GADApplicationIdentifier: ca-app-pub-3940256099942544~1458002511
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
        UIBackgroundModes: []
        CFBundleURLTypes:
          - CFBundleURLName: com.eticahub.bplog
            CFBundleURLSchemes: [bplog]
    entitlements:
      path: BPLog/BPLog.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-identifiers: [iCloud.com.eticahub.bplog]
        com.apple.developer.in-app-payments: []
        com.apple.security.application-groups: [group.com.eticahub.bplog]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eticahub.bplog
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
    scheme:
      testTargets: [BPLogTests]
      storeKitConfiguration: BPLog/Resources/Products.storekit
  BPLogTests:
    type: bundle.unit-test
    platform: iOS
    sources: [BPLog/Tests]
    dependencies:
      - target: BPLog
  BPLogWatch:
    type: application
    platform: watchOS
    sources:
      - path: BPLogWatch/Sources
      - path: BPLogWatch/Resources
    dependencies:
      - target: BPLogWatchWidget
      - sdk: WatchConnectivity.framework
    info:
      path: BPLogWatch/Info.plist
      properties:
        CFBundleDisplayName: BP Log
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.eticahub.bplog
        WKRunsIndependentlyOfCompanionApp: false
    entitlements:
      path: BPLogWatch/BPLogWatch.entitlements
      properties:
        com.apple.security.application-groups: [group.com.eticahub.bplog.watch]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eticahub.bplog.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
        SKIP_INSTALL: true
  BPLogWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - path: BPLogWatchWidget/Sources
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: BPLogWatchWidget/Info.plist
      properties:
        CFBundleDisplayName: BP Log
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: BPLogWatchWidget/BPLogWatchWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.eticahub.bplog.watch]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eticahub.bplog.watchkitapp.widget
        TARGETED_DEVICE_FAMILY: "4"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
        SKIP_INSTALL: true
  BPLogWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: BPLogWidget/Sources
      - path: BPLog/Sources/Models/Reading.swift
      - path: BPLog/Sources/Models/SharedContainer.swift
    dependencies:
      - package: BPCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: BPLogWidget/Info.plist
      properties:
        CFBundleDisplayName: BP Log
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: BPLogWidget/BPLogWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.eticahub.bplog]
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-identifiers: [iCloud.com.eticahub.bplog]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eticahub.bplog.widget
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
        SKIP_INSTALL: true

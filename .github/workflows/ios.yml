name: iOS build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: BPCore (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - run: swift test --package-path BPCore

  ios:
    name: BPLog (iOS simulator)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          XC="$(ls -d /Applications/Xcode_16.4*.app 2>/dev/null | tail -1)"
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version
          xcrun simctl list runtimes
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build and test
        run: |
          xcodebuild test \
            -project BPLog.xcodeproj \
            -scheme BPLog \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcodebuild.log | grep -E "error:|Test Suite|Test Case .* (passed|failed)|Executed|TEST (SUCCEEDED|FAILED)" || true
          grep -q "TEST SUCCEEDED" xcodebuild.log
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: ~/Library/Developer/Xcode/DerivedData/**/Logs
